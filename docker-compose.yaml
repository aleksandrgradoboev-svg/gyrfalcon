# Запуск gyrfalcon в контейнере.
#
#   docker compose up -d --build          поднять MCP по HTTP
#   docker compose logs -f                посмотреть, что сказал сервер
#   docker compose --profile build run --rm build   собрать индекс
#
# Пути и порт задаются переменными окружения (или файлом .env рядом):
#
#   INDEX_DIR   каталог с индексами *.db      по умолчанию ./index
#   SRC_DIR     выгрузка конфигурации 1С      по умолчанию ./src-1c
#   BIND_HOST   на каком адресе хоста открыть по умолчанию 127.0.0.1
#   PORT        порт хоста                    по умолчанию 8788
#   HOST_UID    чей пользователь пишет индекс по умолчанию 10001
#   HOST_GID                                  (сборке нужно право писать)

services:
  # ── MCP по HTTP ────────────────────────────────────────────────────────
  gyrfalcon:
    build: .
    image: gyrfalcon:0.1.2
    container_name: gyrfalcon

    # --bind 0.0.0.0 обязателен, и это не небрежность: 127.0.0.1 внутри
    # контейнера — его собственная петля, снаружи по ней не достучаться
    # даже через опубликованный порт. Наружу выносит строка ports, и там
    # по умолчанию петля ХОСТА — сеть контейнера дальше неё не идёт.
    #
    # --index-dir, а не --db: каталог делает каждый *.db отдельным
    # проектом, и добавить конфигурацию можно, не трогая compose.
    # Догонять индекс самому — добавить --auto-update; по умолчанию
    # выключено намеренно (Р-019 к этому не относится, см. --auto-update).
    command: serve --index-dir /data --http --bind 0.0.0.0

    ports:
      - "${BIND_HOST:-127.0.0.1}:${PORT:-8788}:8788"

    volumes:
      # Только чтение: сервер в индекс не пишет. Если включаете
      # --auto-update — снимите :ro, ему нужно перезаписывать файл.
      - "${INDEX_DIR:-./index}:/data:ro"

    # Файловая система контейнера тоже только на чтение: писать серверу
    # некуда и незачем. SQLite при этом просит места под временные файлы —
    # отсюда tmpfs на /tmp.
    read_only: true
    tmpfs:
      - /tmp

    # Проверка живости спрашивает у сервера ping по MCP, а не стучится в
    # порт: открытый порт говорит лишь о том, что процесс жив, а нам нужно
    # знать, что он ОТВЕЧАЕТ. Через /dev/tcp самого bash — чтобы не тащить
    # curl в образ ради одной строки.
    #
    # Именно bash, а не CMD-SHELL: CMD-SHELL это /bin/sh, в Debian он dash,
    # а /dev/tcp — возможность bash и в dash не работает вовсе.
    healthcheck:
      test:
        - CMD
        - bash
        - -c
        - >-
          exec 3<>/dev/tcp/127.0.0.1/8788 &&
          printf 'POST /mcp HTTP/1.1\r\nHost: localhost\r\nContent-Length: 40\r\nConnection: close\r\n\r\n{"jsonrpc":"2.0","id":0,"method":"ping"}' >&3 &&
          grep -q '200 OK' <&3
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3

    restart: unless-stopped

    # Сервер не ходит в сеть — ни при ответе, ни в фоне. Права на это ему
    # тоже не нужны.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL

  # ── Сборка индекса ─────────────────────────────────────────────────────
  #
  # Отдельным профилем: это разовая работа, а не служба, и по `up` она
  # подниматься не должна.
  #
  #   docker compose --profile build run --rm build
  #
  # Словарь семантики в образ не кладётся (40 МБ на каждый образ) —
  # если он нужен, домонтируйте его и добавьте --dict.
  build:
    build: .
    image: gyrfalcon:0.1.2
    profiles: ["build"]
    command: build /src --out /data/config.db

    # Пишет индекс, поэтому запускается от хозяина каталога, а не от
    # встроенного 10001: иначе файл ляжет с чужим владельцем.
    user: "${HOST_UID:-10001}:${HOST_GID:-10001}"

    volumes:
      - "${SRC_DIR:-./src-1c}:/src:ro"
      - "${INDEX_DIR:-./index}:/data"
