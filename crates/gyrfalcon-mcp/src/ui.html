<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<title>gyrfalcon — карта конфигурации</title>
<style>
  :root{
    --bg:#0e1116; --panel:#161b22; --line:#26303d; --text:#e6edf3; --dim:#8b949e;
    --doc:#f0883e; --reg:#58a6ff; --sub:#a371f7; --ext:#3fb950; --warn:#d29922;
  }
  *{box-sizing:border-box}
  html,body{margin:0;height:100%;background:var(--bg);color:var(--text);
    font:14px/1.45 "Segoe UI",system-ui,sans-serif;overflow:hidden}
  header{display:flex;align-items:center;gap:18px;padding:10px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);flex-wrap:wrap}
  h1{font-size:15px;margin:0;font-weight:600;letter-spacing:.3px}
  h1 span{color:var(--dim);font-weight:400}
  .tabs{display:flex;gap:6px}
  .tab{padding:5px 13px;border:1px solid var(--line);border-radius:6px;cursor:pointer;
    background:transparent;color:var(--dim);font:inherit;transition:.15s}
  .tab:hover{border-color:#3d4a5c;color:var(--text)}
  .tab.on{background:#1f6feb22;border-color:#1f6feb;color:#79c0ff}
  .stats{margin-left:auto;display:flex;gap:16px;color:var(--dim);font-size:12px;flex-wrap:wrap}
  .stats b{color:var(--text);font-weight:600}
  .bar{display:flex;align-items:center;gap:12px;padding:8px 16px;
    background:var(--panel);border-bottom:1px solid var(--line);font-size:12px;flex-wrap:wrap}
  input[type=search]{background:#0d1117;border:1px solid var(--line);color:var(--text);
    padding:5px 10px;border-radius:6px;font:inherit;width:230px;outline:none}
  input[type=search]:focus{border-color:#1f6feb}
  input[type=range]{width:130px;accent-color:#1f6feb}
  .legend{display:flex;gap:14px;margin-left:auto;color:var(--dim)}
  .legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px}
  #stage{position:absolute;inset:0;top:0;cursor:grab}
  #stage.drag{cursor:grabbing}
  svg{width:100%;height:100%;display:block}
  /* Прозрачность связей рассчитана на ПЕРЕКРЫТИЕ, а не на одну линию.
     При 776 дугах непрозрачность .4 складывается в сплошной фон, поверх
     которого не читается ни подпись, ни отдельная связь — что и было
     видно замером яркости по кольцам. Отдельная дуга при .13 бледна,
     но её и не читают поодиночке: поодиночке смотрят подсвеченную
     (.link.hot), а фоновая масса нужна лишь как форма пучков. */
  .link{fill:none;stroke:#3a4757;stroke-opacity:.13;transition:stroke .15s,stroke-opacity .15s}
  .link.hot{stroke:#79c0ff;stroke-opacity:.95;stroke-width:2}
  .link.cold{stroke-opacity:.05}
  .own{fill:none;transition:stroke-opacity .15s}
  .own.hot{stroke-opacity:.9;stroke-width:1.6}
  .own.cold{stroke-opacity:.03}
  .node{cursor:pointer}
  .node circle{transition:r .15s,filter .15s}
  /* Подпись читается ПОВЕРХ любой плотности связей: тонкая обводка цветом
     фона отделяет текст от того, что под ним. Без неё подпись регистра,
     пересечённая десятком дуг, распадается на куски. paint-order кладёт
     обводку ПОД заливку — иначе она съедает тонкие буквы. */
  .node text{font-size:11px;fill:var(--dim);pointer-events:none;transition:fill .15s;
             paint-order:stroke;stroke:#0e1116;stroke-width:3px;stroke-linejoin:round}
  .node.hot text{fill:#fff;font-weight:600}
  .node.hot circle{filter:drop-shadow(0 0 7px currentColor)}
  .node.cold{opacity:.2}
  .node.hit circle{stroke:#fff;stroke-width:2}
  .sec{cursor:pointer;transition:fill-opacity .12s}
  #tip{position:absolute;pointer-events:none;background:#0d1117ee;border:1px solid var(--line);
    border-radius:6px;padding:8px 11px;font-size:12px;max-width:340px;opacity:0;transition:.1s;
    box-shadow:0 6px 24px #0008}
  #tip.on{opacity:1}
  #tip b{color:#79c0ff}
  #note{position:absolute;left:16px;bottom:12px;color:var(--dim);font-size:11px;
    background:#0d1117cc;padding:6px 10px;border-radius:6px;border:1px solid var(--line)}
  .wrap{position:absolute;inset:0;top:88px}
</style>
</head>
<body>
<header>
  <h1>gyrfalcon <span id="src">—</span></h1>
  <div class="tabs">
    <button class="tab on" data-view="movements">Движения</button>
    <button class="tab" data-view="subsystems">Подсистемы</button>
    <button class="tab" data-view="overrides">Расширения</button>
  </div>
  <div class="stats" id="stats"></div>
</header>
<div class="bar">
  <input type="search" id="q" placeholder="поиск по имени…">
  <label>показывать <input type="range" id="lim" min="10" max="150" value="40"> <b id="limv">40</b></label>
  <button class="tab" id="fit">По размеру окна</button>
  <div class="legend" id="legend"></div>
</div>
<div class="wrap"><div id="stage"><svg id="svg"></svg></div></div>
<div id="tip"></div>
<div id="note"></div>

<script>
const $ = s => document.querySelector(s);
const svg = $("#svg"), tip = $("#tip"), NS = "http://www.w3.org/2000/svg";
// Вкладку можно выбрать адресом (#subsystems) — так на страницу удобно
// ссылаться и снимать её автоматически.
const ХЭШ = location.hash.replace("#","");
let view = ["movements","subsystems","overrides"].includes(ХЭШ) ? ХЭШ : "movements",
    data = null, limit = 40, query = "";
let vx = 0, vy = 0, scale = 1, W = 0, H = 0;

const el = (n, a = {}) => { const e = document.createElementNS(NS, n);
  for (const k in a) e.setAttribute(k, a[k]); return e; };

async function load(){
  const s = await (await fetch("/api/summary")).json();
  $("#src").textContent = s.source.split(/[\\/]/).slice(-3).join("/");
  $("#stats").innerHTML =
    `модулей <b>${fmt(s.modules)}</b> · методов <b>${fmt(s.methods)}</b> ·`+
    ` рёбер <b>${fmt(s.calls)}</b> <span title="разрешено в конкретную цель">(${s.resolved_pct}%)</span> ·`+
    ` объектов <b>${fmt(s.objects)}</b> · движений <b>${fmt(s.movements)}</b> ·`+
    ` подсистем <b>${fmt(s.subsystems)}</b> · перехватов <b>${fmt(s.overrides)}</b>`;
  await draw();
}
const fmt = n => (n < 0 ? "—" : n.toLocaleString("ru"));

async function draw(){
  // У иерархии свой масштаб: 40 веток обрывают дерево на середине,
  // поэтому подсистемам даём больше — они всё равно вкладываются друг в друга.
  const лимит = view === "subsystems" ? Math.max(limit, 150) : limit;
  data = await (await fetch(`/api/${view}?limit=${лимит}`)).json();
  svg.innerHTML = "";
  W = svg.clientWidth; H = svg.clientHeight;
  if (view === "movements") movements();
  else if (view === "subsystems") subsystems();
  else overrides();
  apply();
}

/* ── Движения: три кольца — подсистемы, документы, регистры ─────
   Первая редакция ставила всё на одно кольцо, сгруппировав по подсистеме.
   Замер показал, почему это не работает: из 776 связей ВНУТРИ своей
   подсистемы оказалось 8. Подсистемы 1С делят интерфейс пользователя,
   а не потоки данных, поэтому как ключ кластера они бесполезны — зато
   отдельным слоем полезны вполне.

   Отсюда раскладка: снаружи подсистемы, в середине документы, внутри
   регистры. Внутренние дуги отвечают на «кто куда пишет», внешние —
   на «чьё это хозяйство». Два вопроса, два слоя, ни один не мешает
   другому.                                                            */
function movements(){
  const g = el("g", {id: "root"}); svg.appendChild(g);
  const D = data.documents, R = data.registers, C = data.clusters;
  const byName = {};
  [...D, ...R].forEach(n => { byName[n.name] = n; _cl[n.name] = n.cluster; });

  const cx = W/2, cy = H/2;
  // Радиусы разведены так, чтобы на КАЖДОМ кольце подписи не наложились:
  // длина окружности растёт с радиусом, а число узлов на кольцах одинаково.
  // Первая редакция ставила регистры на 0.40 — сорок подписей на короткой
  // окружности слиплись в нечитаемое месиво.
  // Порядок колец изнутри наружу: ПОДСИСТЕМЫ → ДОКУМЕНТЫ → РЕГИСТРЫ.
  // Читается как ход учёта: участок порождает документы, документы пишут
  // в регистры. Регистры снаружи ещё и потому, что имена у них длиннее
  // (НДСЗаписиКнигиПродаж), а длинной подписи нужна длинная окружность.
  // Поле берётся по ВЫСОТЕ, а не по меньшей стороне: экран шире, чем выше,
  // и подписи регистров уходят вбок — по горизонтали место есть всегда.
  // Радиусы. Замер плотности (БП, 40+40 узлов, полотно 1600×1000) показал,
  // почему прежняя раскладка не читалась: на кольцо документов приходилось
  // 34,8 px на узел при подписи в 130-160 px, причём подписи смотрели
  // ВНУТРЬ — туда же, где сидели 17 подсистем на радиусе 99 px и куда
  // прогибались 776 дуг. Три слоя в одной зоне: текст, текст и связи.
  //
  // Отсюда три решения, каждое снимает свой слой:
  //   — подписи документов уходят НАРУЖУ, в зазор между кольцами;
  //   — зазор для этого расширен (0.58 → 0.50 от внешнего радиуса);
  //   — подсистемы уходят из центра на своё кольцо у самого края зазора,
  //     а центр остаётся дугам.
  const Rreg = H/2 - 70;                // регистры — снаружи
  const Rdoc = Rreg * 0.50;             // документы — посередине
  const Rout = Rreg * 0.30;             // подсистемы — между центром и документами

  const ring = (arr, radius, from) => {
    const step = Math.PI*2 / Math.max(arr.length, 1);
    arr.forEach((n, i) => {
      n.ang = from + i*step;
      n.r = radius;
      n.x = cx + Math.cos(n.ang)*radius;
      n.y = cy + Math.sin(n.ang)*radius;
    });
  };
  // Документы и регистры разведены по фазе: связь между ними идёт наискось,
  // а не строго по радиусу, иначе пучки сливаются в звезду.
  ring(D, Rdoc, -Math.PI/2);
  ring(R, Rreg, -Math.PI/2 + Math.PI/Math.max(R.length,1));
  const cl = C.filter(c => c.size > 1);
  ring(cl, Rout, -Math.PI/2);
  const byCluster = {}; cl.forEach(c => byCluster[c.name] = c);

  // 1. Принадлежность подсистеме — тонкие линии наружу.
  const gp = el("g"); g.appendChild(gp);
  for (const n of [...D, ...R]){
    const c = byCluster[n.cluster];
    if (!c) continue;
    const ma = (n.ang + c.ang)/2, mr = (n.r + c.r)/2;
    const p = el("path", {class: "own",
      d: "M"+n.x+","+n.y+" Q"+(cx+Math.cos(ma)*mr)+","+(cy+Math.sin(ma)*mr)+" "+c.x+","+c.y,
      stroke: "var(--sub)", "stroke-opacity": .13, "stroke-width": 1, fill: "none"});
    p.dataset.from = n.name;
    gp.appendChild(p);
  }

  // 2. Движения — дуги от кольца документов к кольцу регистров.
  const gl = el("g"); g.appendChild(gl);
  for (const l of data.links){
    const a = byName[l.from], b = byName[l.to];
    if (!a || !b) continue;
    // Управляющая точка дуги. Прежде она ставилась ВНУТРИ, на радиусе
    // 0.30 от суммы — то есть все 776 связей физически проходили через
    // середину круга и сливались в чернильное пятно, поверх которого
    // стояли подсистемы. Прогиб при этом не лечится подбором числа:
    // хорда между двумя кольцами заходит внутрь при любом коэффициенте
    // меньше единицы, потому что оба конца лежат на окружностях.
    //
    // Поэтому дуга прогибается НАРУЖУ — управляющая точка выносится за
    // кольцо документов, в тот же зазор, где идут связи. Внутренняя
    // область освобождается целиком и достаётся подсистемам, ради которых
    // она и заводилась.
    //
    // Исключение — связи между почти соседними по углу узлами: им внешний
    // прогиб не нужен, они и так идут по краю коротким путём.
    const δ = Math.abs(((a.ang - b.ang) % (Math.PI*2) + Math.PI*3) % (Math.PI*2) - Math.PI);
    const близко = δ > Math.PI - 0.5;      // почти соседние по углу
    const mr = близко ? (a.r + b.r) * 0.5 : Math.max(a.r, b.r) * 1.02;
    // Середина берётся по КОРОТКОЙ стороне: без этого дуга между узлами
    // по разные стороны от нуля углов уходит через весь круг наискось.
    const ma0 = (a.ang + b.ang) / 2;
    const ma = Math.abs(a.ang - b.ang) > Math.PI ? ma0 + Math.PI : ma0;
    const p = el("path", {class: "link",
      d: "M"+a.x+","+a.y+" Q"+(cx+Math.cos(ma)*mr)+","+(cy+Math.sin(ma)*mr)+" "+b.x+","+b.y,
      "stroke-width": 1});
    p.dataset.from = l.from; p.dataset.to = l.to;
    if (l.source === "code") p.setAttribute("stroke-dasharray", "3 3");
    gl.appendChild(p);
  }

  // 3. Узлы поверх всего.
  const gn = el("g"); g.appendChild(gn);
  const rad = w => 3 + Math.sqrt(w)*1.7;
  const узел = (n, color, подпись, внутрь) => {
    const gg = el("g", {class: "node", transform: "translate("+n.x+","+n.y+")"});
    gg.style.color = color;
    const rr = rad(n.weight ?? n.size);
    gg.appendChild(el("circle", {r: rr, fill: color, "fill-opacity": .9}));
    const наружу = Math.cos(n.ang) >= 0;
    const внеш = внутрь ? !наружу : наружу;
    const t = el("text", {
      x: внеш ? rr+5 : -(rr+5), y: 3.5,
      "text-anchor": внеш ? "start" : "end",
      transform: "rotate("+((n.ang*180/Math.PI) + (наружу ? 0 : 180))+")"});
    t.textContent = подпись.length > 24 ? подпись.slice(0,23)+"…" : подпись;
    gg.appendChild(t);
    gg.dataset.name = n.name;
    return gg;
  };
  for (const n of D){
    // Подпись НАРУЖУ (внутрь=false): в зазоре между кольцом документов
    // и кольцом регистров её никто не перекрывает, тогда как внутри она
    // ложилась поверх подсистем и пучка дуг.
    const gg = узел(n, "var(--doc)", n.name, false);
    gg.onmouseenter = e => { hot(n.name); show(e,
      "<b>"+n.name+"</b><br>Документ · пишет в "+n.weight+" регистр(ов)<br>"+
      "<span style='color:var(--sub)'>"+n.cluster+"</span>"); };
    gg.onmouseleave = () => { cool(); hide(); };
    gn.appendChild(gg);
  }
  for (const n of R){
    const gg = узел(n, "var(--reg)", n.name, false);
    gg.onmouseenter = e => { hot(n.name); show(e,
      "<b>"+n.name+"</b><br>Регистр · в него пишут "+n.weight+" документ(ов)<br>"+
      "<span style='color:var(--sub)'>"+n.cluster+"</span>"); };
    gg.onmouseleave = () => { cool(); hide(); };
    gn.appendChild(gg);
  }
  for (const c of cl){
    const gg = el("g", {class: "node", transform: "translate("+c.x+","+c.y+")"});
    gg.style.color = "var(--sub)";
    gg.appendChild(el("circle", {r: 3 + Math.sqrt(c.size)*1.5, fill: "var(--sub)",
      "fill-opacity": .75}));
    // Подсистемы в центре: подписи ставим по касательной наружу от их
    // маленького кольца, иначе они наложатся друг на друга в точке.
    const наружу = Math.cos(c.ang) >= 0;
    const t = el("text", {x: наружу ? 9 : -9, y: 3.5,
      "text-anchor": наружу ? "start" : "end", "font-size": 9,
      transform: "rotate("+((c.ang*180/Math.PI) + (наружу ? 0 : 180))+")"});
    const nm = c.name.replace(/^— | —$/g, "");
    t.textContent = (nm.length > 24 ? nm.slice(0,23)+"…" : nm) + " ("+c.size+")";
    gg.appendChild(t);
    gg.dataset.name = c.name;
    gg.onmouseenter = e => { hotCluster(c.name); show(e,
      "<b>"+nm+"</b><br>подсистема · "+c.size+" объект(ов) в движениях"); };
    gg.onmouseleave = () => { cool(); hide(); };
    gn.appendChild(gg);
  }

  // Легенда называет кольца ТАК ЖЕ, как они лежат. Прежняя писала
  // «подсистемы (снаружи)» и «регистры (внутри)» — ровно наоборот, и это
  // не мелочь: подпись, противоречащая картинке, заставляет читателя
  // сомневаться в самой картинке.
  $("#legend").innerHTML =
    "<span><i style='background:var(--sub)'></i>подсистемы (в центре)</span>"+
    "<span><i style='background:var(--doc)'></i>документы</span>"+
    "<span><i style='background:var(--reg)'></i>регистры (снаружи)</span>";
  note(data.links.length+" движений из "+fmt(data.total_links)+" · "+
       D.length+" из "+fmt(data.total_documents)+" документов · "+
       R.length+" из "+fmt(data.total_registers)+" регистров · "+cl.length+" подсистем. "+
       "Дуги внутри — кто в какой регистр пишет; линии наружу — чьё это хозяйство. "+
       "Наведите на узел, чтобы оставить только его связи.");
}

/* Подсветить всё, что принадлежит подсистеме. */
function hotCluster(name){
  const свои = new Set([name]);
  svg.querySelectorAll(".own").forEach(p => {
    const on = (_cl[p.dataset.from] === name);
    p.classList.toggle("hot", on); p.classList.toggle("cold", !on);
    if (on) свои.add(p.dataset.from);
  });
  svg.querySelectorAll(".link").forEach(l => {
    const on = свои.has(l.dataset.from) || свои.has(l.dataset.to);
    l.classList.toggle("hot", on); l.classList.toggle("cold", !on);
  });
  svg.querySelectorAll(".node").forEach(n =>
    n.classList.toggle("cold", !свои.has(n.dataset.name)));
}
const _cl = {};

/* ── Подсистемы: солнечная диаграмма по вложенности ─────────────
   У подсистем 1С есть иерархия — на БП это 588 подсистем и ПЯТЬ уровней
   вложенности. Плоский список круглешков её терял целиком, хотя данные
   лежат в индексе (путь разбирается из имени файла на сервере).

   Кольцами от центра наружу: уровень вложенности — номер кольца, ширина
   сектора — доля объектов. Клик проваливается в ветку, клик в центр
   возвращает наверх.                                                  */
let sbRoot = [];                       // текущий корень (путь), [] = вся конфигурация

function subsystems(){
  const g = el("g", {id: "root"}); svg.appendChild(g);
  const cx = W/2, cy = H/2;
  const N = data.nodes.filter(n => (n.path||[]).length);

  // Дерево строится из путей: узел под своим путём, вес — объекты СВОИ.
  const root = {name: "", children: {}, own: 0, path: []};
  for (const n of N){
    let cur = root;
    n.path.forEach((ч, i) => {
      cur = (cur.children[ч] ||= {name: ч, children: {}, own: 0,
                                  path: n.path.slice(0, i+1)});
    });
    cur.own = n.total;
    cur.node = n;
  }
  // Суммарный вес = свои объекты плюс потомки.
  const sum = t => t.total = t.own + Object.values(t.children)
    .reduce((a, c) => a + sum(c), 0);
  sum(root);

  // Спуск к выбранному корню.
  let cur = root;
  for (const ч of sbRoot){ if (cur.children[ч]) cur = cur.children[ч]; }

  // Радиус — по меньшей стороне полотна минус поле под подписи внешнего
  // кольца. Прежние «минус 60» оставляли четверть экрана пустой.
  const R = Math.min(H, W)/2 - 24;
  // R0 объявляется ОТДЕЛЬНОЙ строкой: в одном `const` через запятую R ещё
  // не инициализирован, и R*0.13 давало NaN — диаграмма молча падала
  // на запасное значение и занимала четверть экрана.
  const R0 = Math.max(46, R*0.16);
  // Колец показываем ТРИ, а не всю глубину. Замер объяснил, почему:
  // до пятого уровня доходят единичные ветки, и при пяти кольцах они
  // торчали тонкими спицами, а основная площадь пустовала. Три широких
  // кольца читаются, а глубже открывается кликом — там своя тройка.
  const глубь = t => 1 + Math.max(0, ...Object.values(t.children).map(глубь));
  const уровней = Math.max(1, Math.min(3, глубь(cur) - 1));
  const шаг = (R - R0) / уровней;
  const пал = ["#a371f7","#58a6ff","#3fb950","#f0883e","#d29922","#f778ba"];

  // Минимальная ДУГОВАЯ длина сектора, ниже которой он не рисуется.
  //
  // Прежний порог задавался в углах (0,004 рад) и был неверен по смыслу:
  // читаемость сектора зависит от дуговой длины (угол × радиус), а она на
  // внешнем кольце втрое больше при том же угле. Отсюда и «спицы» —
  // на внешнем кольце десятки волосков в 2-3 пикселя, без подписей, рваной
  // бахромой за краем круга. Занятая площадь есть, смысла ноль.
  // Значение подобрано ЗАМЕРОМ по фактической геометрии (БП, 588 подсистем,
  // полотно 1600×1000): при пороге 7 px секторов тоньше порога не остаётся
  // вовсе, но 28 штук ложатся в 7-12 px — и именно они читаются бахромой,
  // потому что подпись в такой сектор не влезает и он остаётся НЕМЫМ.
  // Порог берётся по тому, при какой ширине сектор способен нести смысл,
  // а не по тому, при какой он перестаёт быть виден.
  const МИНДУГА = 14;                    // пикселей по средней окружности кольца

  const рисовать = (t, a0, a1, глубина, цвет) => {
    if (глубина > уровней) return;
    const r0 = R0 + (глубина-1)*шаг, r1 = r0 + шаг - 2;
    if (глубина >= 1 && (a1-a0) * ((r0+r1)/2) < МИНДУГА) return;
    if (глубина >= 1){
      const p = el("path", {class: "sec",
        d: sector(cx, cy, r0, r1, a0, a1),
        fill: цвет, "fill-opacity": .30 + .12*(6-глубина),
        stroke: "#0e1116", "stroke-width": 1});
      p.dataset.name = t.name;
      p.onmouseenter = e => { p.setAttribute("fill-opacity", .85); show(e, t.свёрнуто
        ? "<b>прочие</b><br>"+t.свёрнуто+" мелких ветвей · объектов "+t.total+
          "<br><span style='color:var(--dim)'>по отдельности каждая тоньше "+
          "различимого — свёрнуты, чтобы не сыпаться спицами по краю</span>"
        : "<b>"+(t.node?.synonym || t.name)+"</b><br>"+
        "уровень "+глубина+" · объектов в ветке "+t.total+
        (t.own ? " (своих "+t.own+")" : "")+
        (Object.keys(t.children).length ? "<br>вложенных: "+
          Object.keys(t.children).length : "")+
        "<br><span style='color:var(--dim)'>клик — провалиться внутрь</span>"); };
      p.onmouseleave = () => { p.setAttribute("fill-opacity", .30 + .12*(6-глубина)); hide(); };
      if (!t.свёрнуто) p.onclick = () => { sbRoot = t.path.slice(); draw(); };
      g.appendChild(p);

      // Подпись — если сектор достаточно широк, чтобы её не резать.
      const ширина = (a1-a0) * ((r0+r1)/2);
      if (ширина > 34){
        const am = (a0+a1)/2, rm = (r0+r1)/2;
        const по = Math.cos(am) >= 0;
        const t2 = el("text", {
          x: cx + Math.cos(am)*rm, y: cy + Math.sin(am)*rm,
          "text-anchor": "middle", "font-size": Math.min(12, 6 + ширина/12),
          fill: "#fff", "fill-opacity": .92, "pointer-events": "none",
          transform: "rotate("+((am*180/Math.PI) + (по ? 0 : 180))+","+
            (cx+Math.cos(am)*rm)+","+(cy+Math.sin(am)*rm)+")"});
        const имя = t.node?.synonym || t.name;
        const макс = Math.floor(ширина/6);
        t2.textContent = имя.length > макс ? имя.slice(0, макс-1)+"…" : имя;
        g.appendChild(t2);
      }
    }
    // Дети делят угол пропорционально своему весу.
    // Дети делят угол по сумме СВОИХ весов. Делить по t.total неверно:
    // в него входят и собственные объекты узла, которых у детей нет, —
    // круг тогда не замыкается и остаётся пустой сектор.
    const дети = Object.values(t.children).sort((x,y) => y.total - x.total);
    const всего = дети.reduce((s,c) => s + c.total, 0) || 1;

    // Мелкие ветки сворачиваются в ОДИН сектор «прочие», а не отбрасываются
    // порогом молча. Разница принципиальная: отброшенная доля читается как
    // «этого нет», а свёрнутая говорит, сколько именно спрятано и где.
    // То же правило, что у сервера про усечение списков: пропажу называют
    // вслух.
    // Пригодность ребёнка проверяется по его ФАКТИЧЕСКОЙ дуге на СВОЁМ
    // кольце, а не по доле внутри родителя. Разница видна на узком родителе:
    // ребёнок с долей 40% от тонкого сектора всё равно волосок, а проверка
    // «доля больше порога» его пропускает. Такой узел потом молча отсекался
    // уже в `рисовать` — и оставлял после себя дыру, потому что братья
    // к тому моменту разложены. Отсюда и бахрома, пережившая первую правку.
    //
    // Отбор идёт от крупных к мелким: как только очередной ребёнок не
    // дотягивает до порога, все оставшиеся (они мельче — список отсортирован)
    // уходят в «прочие» вместе с ним. Это гарантирует, что нарисованное
    // всегда шире порога, а свёрнутое названо числом.
    const r0д = R0 + глубина*шаг, r1д = r0д + шаг - 2;
    const Rср = ((r0д + r1д)/2) || 1;
    const дуга = c => (a1-a0) * (c.total/всего) * Rср;

    let крупные = [], мелкие = [];
    for (const c of дети){
      if (!мелкие.length && дуга(c) >= МИНДУГА) крупные.push(c); else мелкие.push(c);
    }
    // Свёрнутый сектор сам обязан быть читаемым: если «прочих» набралось
    // на волосок, отдаём их последнему крупному соседу — иначе мы заменили
    // бахрому из многих волосков одним, что не лечение, а переименование.
    if (мелкие.length){
      const сумма0 = мелкие.reduce((s,c) => s + c.total, 0);
      if ((a1-a0) * (сумма0/всего) * Rср < МИНДУГА && крупные.length){
        мелкие = []; // слишком мало, чтобы показывать отдельно
      }
    }

    let a = a0;
    крупные.forEach((c, i) => {
      const w = (a1-a0) * (c.total/всего);
      рисовать(c, a, a + w, глубина+1, глубина === 0 ? пал[i % пал.length] : цвет);
      a += w;
    });
    if (мелкие.length){
      const сумма = мелкие.reduce((s,c) => s + c.total, 0);
      const w = (a1-a0) * (сумма/всего);
      // Псевдоузел: детей не имеет (внутрь проваливаться некуда), но
      // говорит, сколько веток и объектов свернул.
      const прочие = {name: "прочие", children: {}, own: сумма, total: сумма,
                      path: t.path, свёрнуто: мелкие.length};
      рисовать(прочие, a, a + w, глубина+1,
               глубина === 0 ? пал[крупные.length % пал.length] : цвет);
      a += w;
    }
  };
  рисовать(cur, -Math.PI/2, Math.PI*1.5, 0, пал[0]);

  // Центр: возврат наверх и подпись текущей ветки.
  const c0 = el("circle", {cx: cx, cy: cy, r: R0-6, fill: "var(--panel)",
    stroke: "var(--line)", class: "node"});
  c0.onclick = () => { if (sbRoot.length){ sbRoot.pop(); draw(); } };
  g.appendChild(c0);
  const подпись = sbRoot.length ? sbRoot[sbRoot.length-1] : "вся конфигурация";
  const t0 = el("text", {x: cx, y: cy - 4, "text-anchor": "middle",
    "font-size": 12, fill: "var(--text)", "pointer-events": "none"});
  t0.textContent = подпись.length > 16 ? подпись.slice(0,15)+"…" : подпись;
  g.appendChild(t0);
  const t1 = el("text", {x: cx, y: cy + 13, "text-anchor": "middle",
    "font-size": 10, fill: "var(--dim)", "pointer-events": "none"});
  t1.textContent = sbRoot.length ? "↑ наверх" : cur.total + " объектов";
  g.appendChild(t1);

  $("#legend").innerHTML =
    "<span style='opacity:.75'>кольцо = уровень вложенности · сектор = доля объектов</span>";
  note(+N.length+" подсистем из "+fmt(data.total_subsystems)+" · до 5 уровней вложенности. "+
       (sbRoot.length ? "Ветка: "+sbRoot.join(" → ")+". Клик в центр — наверх. "
                      : "Клик по сектору — провалиться в ветку. ")+
       "Ширина сектора — доля объектов, включая вложенные подсистемы.");
}

/* Кольцевой сектор: от r0 до r1, от угла a0 до a1. */
function sector(cx, cy, r0, r1, a0, a1){
  const P = (r,a) => [cx+Math.cos(a)*r, cy+Math.sin(a)*r];
  const big = (a1-a0) > Math.PI ? 1 : 0;
  const [x0,y0] = P(r0,a0), [x1,y1] = P(r1,a0), [x2,y2] = P(r1,a1), [x3,y3] = P(r0,a1);
  return "M"+x0+","+y0+" L"+x1+","+y1+
         " A"+r1+","+r1+" 0 "+big+" 1 "+x2+","+y2+
         " L"+x3+","+y3+" A"+r0+","+r0+" 0 "+big+" 0 "+x0+","+y0+" Z";
}

/* ── Расширения: что перехвачено ────────────────────────────────── */
function overrides(){
  const g = el("g", {id: "root"}); svg.appendChild(g);
  const items = data.items;
  if (!items.length){
    const t = el("text", {x: W/2, y: H/2, "text-anchor": "middle", fill: "var(--dim)"});
    t.textContent = "В этой конфигурации перехватов расширений нет";
    g.appendChild(t);
    note("Пусто — и это факт об индексе, а не о вашем внимании: "+
         "на конфигурации без расширений таблица перехватов пуста законно.");
    $("#legend").innerHTML = "";
    return;
  }
  const byExt = {};
  for (const i of items) (byExt[i.extension] ||= []).push(i);

  // Раскладка в колонки. Первая редакция вела один столбец от y=70 вниз:
  // на семи расширениях ДО это заняло треть экрана и оставило пустыми
  // правые две трети, а на конфигурации с полусотней перехватов уехало бы
  // за полотно молча — без полосы прокрутки, потому что полотно SVG.
  // Считаем высоту блоков заранее и переносим в следующую колонку,
  // когда очередной блок не помещается по высоте.
  const блоки = Object.entries(byExt).map(([ext, list]) =>
    ({ext, list, h: 26 + list.length*34 + 30}));
  // Ширина колонки. Константа здесь не работает: строка адреса длиннее
  // имени расширения и на узкой колонке уезжает за край — первый рендер
  // обрезал третью колонку целиком. Поэтому считаем ЧИСЛО колонок по
  // минимальной пригодной ширине, а саму ширину раздаём поровну от полотна:
  // тогда последняя колонка кончается там же, где полотно.
  const МИНШИР = 640;                    // уже этого адрес не помещается
  const ВЕРХ = 60, НИЗ = 24, ПОЛЕ = 24;
  const кол = Math.max(1, Math.floor((W - ПОЛЕ) / МИНШИР));
  const ШИР = (W - ПОЛЕ) / кол;
  // Высота колонки: либо полотно, либо ровная раскладка по числу колонок,
  // если блоки в полотно не влезают вовсе.
  // Высота колонки. Считать её просто как высоту полотна неверно: пока
  // блоки в полотно помещаются, перенос не срабатывает НИ РАЗУ, и при
  // двух-трёх доступных колонках заполняется одна, а остальные пустуют —
  // ровно это показал первый рендер на ДО. Поэтому высота берётся как
  // ровная делёжка общей высоты на доступные колонки, но не больше
  // полотна: на длинном списке колонка упирается в экран и переносит,
  // на коротком — делит материал поровну и занимает ширину.
  // Высота колонки подбирается так, чтобы блоки уместились РОВНО в `кол`
  // колонок. Просто «общая/кол» этого не гарантирует: блоки неделимы, и
  // при неудачном раскрое последний уезжает в лишнюю колонку за краем
  // полотна — так на первом рендере обрезался «ЧатБотМах». Поэтому высоту
  // наращиваем, пока раскрой не уложится, и не выше полотна.
  const общая = блоки.reduce((a,b) => a + b.h, 0);
  const влезает = h => {
    let c = 1, y = 0;
    for (const b of блоки){ if (y + b.h > h && y > 0){ c++; y = 0; } y += b.h; }
    return c <= кол;
  };
  const Hполотна = H - ВЕРХ - НИЗ;
  let Hкол = Math.max(...блоки.map(b => b.h), Math.ceil(общая / кол));
  while (Hкол < Hполотна && !влезает(Hкол)) Hкол += 20;
  Hкол = Math.min(Hкол, Hполотна);

  let cx0 = 24, y = ВЕРХ;
  // Короткое имя модуля из пути выгрузки 1С.
  //
  // Разбор идёт ПО СТРУКТУРЕ пути, а не по позиции с конца. Первая редакция
  // брала элемент `length-3` — он верен только для общего модуля
  // (CommonModules/Имя/Ext/Module.bsl) и на модуле формы давал подпись
  // «Ext:31», то есть служебный каталог вместо имени. Рендер это показал
  // сразу; по коду выглядело правдоподобно.
  //
  // Три вида путей, которые реально встречаются:
  //   CommonModules/Имя/Ext/Module.bsl              → Имя
  //   Catalogs/Имя/Ext/ObjectModule.bsl             → Имя (модуль объекта)
  //   Catalogs/Имя/Forms/Форма/Ext/Form/Module.bsl  → Имя.Форма
  const имяМодуля = путь => {
    const м = (путь || "").split("/").filter(Boolean);
    if (м.length < 2) return путь || "—";
    const объект = м[1];                         // имя объекта метаданных
    const ф = м.indexOf("Forms");
    if (ф > 0 && м[ф+1]) return `${объект}.${м[ф+1]}`;
    const файл = м[м.length-1] || "";
    if (файл.startsWith("ObjectModule")) return `${объект} (объект)`;
    if (файл.startsWith("ManagerModule")) return `${объект} (менеджер)`;
    return объект;
  };
  const адрес = (путь, строка) => {
    const имя = имяМодуля(путь);
    return строка ? `${имя}:${строка}` : имя;
  };

  for (const {ext, list, h} of блоки){
    if (y + h > ВЕРХ + Hкол && y > ВЕРХ){ y = ВЕРХ; cx0 += ШИР; }
    const gg = el("g", {class: "node", transform: `translate(${cx0+16},${y})`});
    gg.style.color = "var(--ext)";
    gg.appendChild(el("circle", {r: 8 + Math.sqrt(list.length)*3, fill: "var(--ext)", "fill-opacity": .8}));
    // Назначение расширения (Patch / Customization / Adaptation) — не
    // украшение: заплатка вендора и наша доработка живут по разным
    // правилам при обновлении, а на глаз по имени их не различить.
    //
    // Ставится В ОДНУ СТРОКУ с именем, а не под ним. Отдельная строка ниже
    // налезала на имя, и подгонка отступа по вертикали её не лечила —
    // только двигала наложение туда-сюда, что и есть правка на глаз.
    const заголовок = `${ext} — ${list.length} перехват(ов)`;
    const t = el("text", {x: 26, y: 4}); t.textContent = заголовок;
    gg.appendChild(t); gg.dataset.name = ext;
    if (list[0].purpose){
      const tp = el("text", {x: 26 + заголовок.length*6.6 + 10, y: 4,
                             "font-size": 10, fill: "var(--dim)"});
      tp.textContent = list[0].purpose;
      gg.appendChild(tp);
    }
    g.appendChild(gg);

    list.forEach((i, k) => {
      const yy = y + 30 + k*34;
      const l = el("path", {class: "link hot",
        d: `M${cx0+28},${y+6} C${cx0+60},${y+6} ${cx0+60},${yy} ${cx0+96},${yy}`,
        "stroke-width": 1});
      g.appendChild(l);
      // Первая строка — что перехвачено и как.
      const tt = el("text", {x: cx0+104, y: yy + 4, "font-size": 11, fill: "var(--dim)"});
      tt.textContent = `${i.object}.${i.method} — ${i.annotation}`;
      g.appendChild(tt);
      // Вторая — АДРЕС обеих сторон. Это заявленная ось приёмки: перехват
      // без адреса читается как «где-то что-то подменили».
      const ta = el("text", {x: cx0+104, y: yy + 17, "font-size": 10,
                             fill: "var(--sub)", "fill-opacity": .85});
      ta.textContent = `цель ${адрес(i.target_path, i.target_line)}  ←  `+
                       `перехват ${адрес(i.ext_path, i.ext_line)}`;
      g.appendChild(ta);
      // Полные пути — по наведению: в подписи они не помещаются, а искать
      // файл иногда нужно именно по полному пути.
      const зона = el("rect", {x: cx0+96, y: yy - 9, width: ШИР-120, height: 30,
                               fill: "transparent", class: "node"});
      зона.onmouseenter = e => show(e,
        `<b>${i.object}.${i.method}</b><br>${i.annotation}`+
        `<br><span style='color:var(--sub)'>цель:</span> ${i.target_path||"—"}`+
        (i.target_line ? `, строка ${i.target_line}` : "")+
        `<br><span style='color:var(--sub)'>перехватчик:</span> ${i.ext_method||"—"}`+
        `<br>${i.ext_path||"—"}${i.ext_line ? `, строка ${i.ext_line}` : ""}`);
      зона.onmouseleave = () => hide();
      g.appendChild(зона);
    });
    y += h;
  }
  $("#legend").innerHTML = `<span><i style="background:var(--ext)"></i>расширения</span>`;
  note(`${items.length} перехватов в ${блоки.length} расширении(ях). Аннотация — как именно `+
       `вмешивается расширение: Перед / После / Вместо / ИзменениеИКонтроль. `+
       `Вторая строка — адрес: слева что подменяется в конфигурации, справа где лежит `+
       `сам перехватчик. Наведите — полные пути.`);
}

/* ── Подсветка, поиск, зум, панорама ────────────────────────────── */
function hot(name){
  svg.querySelectorAll(".link").forEach(l => {
    const on = l.dataset.from === name || l.dataset.to === name;
    l.classList.toggle("hot", on); l.classList.toggle("cold", !on);
  });
  const связан = new Set([name]);
  svg.querySelectorAll(".link.hot").forEach(l => {
    связан.add(l.dataset.from); связан.add(l.dataset.to);
  });
  svg.querySelectorAll(".node").forEach(n => {
    const on = связан.has(n.dataset.name);
    n.classList.toggle("hot", on); n.classList.toggle("cold", !on);
  });
}
function cool(){
  svg.querySelectorAll(".link,.node").forEach(e =>
    e.classList.remove("hot","cold"));
  apply();
}
function apply(){
  const q = query.trim().toLowerCase();
  svg.querySelectorAll(".node").forEach(n =>
    n.classList.toggle("hit", !!q && (n.dataset.name||"").toLowerCase().includes(q)));
}
function show(e, html){
  tip.innerHTML = html; tip.classList.add("on");
  tip.style.left = Math.min(e.clientX + 14, innerWidth - 360) + "px";
  tip.style.top = (e.clientY + 14) + "px";
}
const hide = () => tip.classList.remove("on");
const note = t => $("#note").textContent = t;

const stage = $("#stage");
let dragging = false, sx = 0, sy = 0, moved = false;
stage.addEventListener("mousedown", e => {
  if (e.target.closest(".node")) return;
  dragging = true; moved = false; sx = e.clientX - vx; sy = e.clientY - vy;
  stage.classList.add("drag");
});
addEventListener("mousemove", e => {
  if (!dragging) return;
  vx = e.clientX - sx; vy = e.clientY - sy; moved = true; transform();
});
addEventListener("mouseup", () => { dragging = false; stage.classList.remove("drag"); });
stage.addEventListener("wheel", e => {
  e.preventDefault();
  const k = e.deltaY < 0 ? 1.12 : 1/1.12;
  const nx = e.clientX, ny = e.clientY - 88;
  vx = nx - (nx - vx) * k; vy = ny - (ny - vy) * k;
  scale *= k; transform();
}, {passive: false});
function transform(){
  const r = svg.querySelector("#root");
  if (r) r.setAttribute("transform", `translate(${vx},${vy}) scale(${scale})`);
}
$("#fit").onclick = () => { vx = vy = 0; scale = 1; transform(); };

// Отметить активной вкладку из адреса.
document.querySelectorAll(".tab[data-view]").forEach(b =>
  b.classList.toggle("on", b.dataset.view === view));

document.querySelectorAll(".tab[data-view]").forEach(b => b.onclick = () => {
  document.querySelectorAll(".tab[data-view]").forEach(x => x.classList.remove("on"));
  b.classList.add("on"); view = b.dataset.view; vx = vy = 0; scale = 1; sbRoot = []; location.hash = view; draw();
});
$("#q").oninput = e => { query = e.target.value; apply(); };
$("#lim").oninput = e => { limit = +e.target.value; $("#limv").textContent = limit; };
$("#lim").onchange = () => draw();
addEventListener("resize", () => draw());
load();
</script>
</body>
</html>
