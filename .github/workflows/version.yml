name: Версия

# PR, меняющий код, обязан поднять версию в [workspace.package] корневого
# Cargo.toml. Иначе релиз забывается молча: правка влита, а версия, тег и
# выпуск остались прежними (случай 01.10.2026 — версию подняли отдельным PR
# после напоминания). Проверяет машина, а не память того, кто правит.
#
# Код не менялся (документация, CI) — проверка не срабатывает. Код менялся,
# а выпуск не нужен — ярлык `no-version-bump` на PR.

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]

# Ярлык читается у GitHub во время прогона, а не из снимка события (ниже),
# поэтому прав нужно чуть больше умолчания — только на чтение PR.
permissions:
  contents: read
  pull-requests: read

# Новый прогон по тому же PR отменяет недоигранный старый. PR, открытый через
# API, получает ярлык вторым запросом через секунду: прогон от `opened` иначе
# доходил до конца без ярлыка и оставлял красную отметку рядом с зелёной от
# `labeled` (#18, #33). Отменённый прогон — серый, не красный.
concurrency:
  group: version-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  bump:
    name: версия поднята
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Сверить версию с main
        env:
          BASE: ${{ github.base_ref }}
          PR: ${{ github.event.pull_request.number }}
          GH_TOKEN: ${{ github.token }}
          EVENT_LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          set -euo pipefail
          git fetch --quiet --tags origin "$BASE"
          # Первая строка `version = ` корневого Cargo.toml — это [workspace.package].
          ver() { grep -m1 -E '^version = "' | sed -E 's/^version = "([^"]+)".*/\1/'; }
          base_ver=$(git show "origin/$BASE:Cargo.toml" | ver)
          head_ver=$(ver < Cargo.toml)
          echo "main: $base_ver, PR: $head_ver"

          code=$(git diff --name-only "origin/$BASE...HEAD" \
            | grep -E '^(crates/|src/|build\.rs$|Cargo\.(toml|lock)$)' || true)
          if [ -z "$code" ]; then
            echo "Код не менялся — версия не обязана расти."
            exit 0
          fi
          # Ярлыки — на момент прогона. Снимок события (`github.event…labels`)
          # фиксируется при событии: прогон от `opened` видел PR без ярлыка,
          # поставленного секундой позже, и перезапуск видел тот же снимок.
          # Сбой API — не повод краснеть: тогда берётся снимок события, как раньше.
          if ! labels=$(gh pr view "$PR" --repo "$GITHUB_REPOSITORY" --json labels --jq '.labels[].name'); then
            echo "::warning::Ярлыки PR не прочитаны через API — беру снимок события."
            labels=$(printf '%s' "$EVENT_LABELS" | tr ',' '\n')
          fi
          echo "Ярлыки PR: ${labels:-нет}"
          if printf '%s\n' "$labels" | grep -qx 'no-version-bump'; then
            echo "::notice::Ярлык no-version-bump: проверка пропущена по решению автора PR."
            exit 0
          fi
          if [ "$head_ver" = "$base_ver" ]; then
            echo "::error file=Cargo.toml::Версия не поднята: $head_ver = main. Поднимите [workspace.package] version или поставьте ярлык no-version-bump."
            echo "Изменён код:"; echo "$code"
            exit 1
          fi
          if git rev-parse -q --verify "refs/tags/v$head_ver" >/dev/null; then
            echo "::error file=Cargo.toml::Тег v$head_ver уже существует — эта версия выпущена. Нужна следующая."
            exit 1
          fi
          echo "Версия поднята: $base_ver → $head_ver"
